target-version = "py312"
line-length = 120
extend-exclude = ["migrations", "staticfiles", "media"]

[lint]
# Correctness-focused: pyflakes, pycodestyle errors, bugbear, import sorting.
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM"]
ignore = ["B904", "SIM105", "SIM108", "UP037", "UP006", "UP007", "UP035", "UP017"]

[lint.per-file-ignores]
"tests/*" = ["B", "SIM", "E501"]
"versuitality/asgi.py" = ["E402", "I001"]

[lint.isort]
known-first-party = ["apps", "versuitality"]
