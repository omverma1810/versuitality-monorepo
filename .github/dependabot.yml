version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      django-stack:
        patterns: ['Django', 'djangorestframework*', 'channels*', 'daphne']
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: ['next', 'react', 'react-dom', 'eslint-config-next', '@types/react*']
  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
